name: Migrate

# Vercel starts the production deployment as soon as main moves, so a manual
# migration can land after the code that needs it. dbmate only applies pending
# files, so this is a no-op when the schema is already up to date.
on:
    push:
        branches: [main]
        paths: [db/migrations/**]
    workflow_dispatch:

concurrency:
    group: migrate-production
    cancel-in-progress: false

permissions:
    contents: read

jobs:
    migrate:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v5
            - uses: ./.github/actions/setup
            - run: bun run db:migrate
              env:
                  POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
