name: CI

on:
    pull_request:
    push:
        branches: [main]

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    format:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v5
            - uses: ./.github/actions/setup
            - run: bun run format:check

    lint:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v5
            - uses: ./.github/actions/setup
            - run: bun run lint

    types:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v5
            - uses: ./.github/actions/setup
            - run: bun run typecheck

    # site.test.ts fetches the repository page and fails while the repo is
    # private. Keep this job out of the required checks until it goes public.
    test:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v5
            - uses: ./.github/actions/setup
            - run: bun test
